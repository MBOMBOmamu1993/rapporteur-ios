# Publier sur App Store Connect — à la main, depuis l'onglet Actions.
#
# Il faut quatre secrets dans le dépôt (Settings → Secrets and variables →
# Actions), tous tirés du compte développeur Apple — voir GUIDE-APPLE.md :
#   APPLE_EQUIPE      l'identifiant d'équipe (Team ID, 10 caractères)
#   ASC_CLE_ID        l'identifiant de la clé d'API App Store Connect (Key ID)
#   ASC_EMETTEUR_ID   l'identifiant d'émetteur (Issuer ID)
#   ASC_CLE_P8        le contenu du fichier AuthKey_XXXX.p8, tel quel
#
# La signature est automatique : Xcode crée et garde dans le nuage le
# certificat de distribution, il n'y a aucun .p12 à manier. Le build téléversé
# apparaît dans App Store Connect quelques minutes plus tard, prêt à être
# attaché à la version et envoyé à l'examen — sans TestFlight.
name: Publier sur App Store Connect

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version visible (MARKETING_VERSION), ex. 1.0.0"
        required: true
        default: "1.0.0"

jobs:
  archiver:
    name: Archiver, signer, téléverser
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Choisir Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet
        run: xcodegen generate

      - name: Poser la clé d'API App Store Connect
        env:
          ASC_CLE_P8: ${{ secrets.ASC_CLE_P8 }}
          ASC_CLE_ID: ${{ secrets.ASC_CLE_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_CLE_P8" > "$HOME/private_keys/AuthKey_${ASC_CLE_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_CLE_ID}.p8"

      - name: Archiver
        env:
          APPLE_EQUIPE: ${{ secrets.APPLE_EQUIPE }}
          ASC_CLE_ID: ${{ secrets.ASC_CLE_ID }}
          ASC_EMETTEUR_ID: ${{ secrets.ASC_EMETTEUR_ID }}
        run: |
          xcodebuild archive \
            -project Rapporteur.xcodeproj \
            -scheme Rapporteur \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Rapporteur.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_CLE_ID}.p8" \
            -authenticationKeyID "$ASC_CLE_ID" \
            -authenticationKeyIssuerID "$ASC_EMETTEUR_ID" \
            RAPPORTEUR_EQUIPE="$APPLE_EQUIPE" \
            DEVELOPMENT_TEAM="$APPLE_EQUIPE" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Exporter et téléverser
        env:
          APPLE_EQUIPE: ${{ secrets.APPLE_EQUIPE }}
          ASC_CLE_ID: ${{ secrets.ASC_CLE_ID }}
          ASC_EMETTEUR_ID: ${{ secrets.ASC_EMETTEUR_ID }}
        run: |
          sed "s/__EQUIPE__/$APPLE_EQUIPE/" ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/Rapporteur.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_CLE_ID}.p8" \
            -authenticationKeyID "$ASC_CLE_ID" \
            -authenticationKeyIssuerID "$ASC_EMETTEUR_ID"

      - name: Garder le journal d'export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-${{ inputs.version }}-${{ github.run_number }}
          path: build/export
          if-no-files-found: ignore
